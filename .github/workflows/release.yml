name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 安装 EAS CLI
        run: npm install -g eas-cli

      - name: EAS 项目初始化
        run: eas init --force --non-interactive
        working-directory: ./mobile

      - name: 构建 Android APK（远程 EAS，等待完成）
        id: build
        working-directory: ./mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
        run: |
          BUILD_JSON=$(eas build --platform android --profile production --wait --json)
          echo "$BUILD_JSON"
          BUILD_ID=$(echo "$BUILD_JSON" | jq -r '.[0].id // empty')
          test -n "$BUILD_ID"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: 下载 APK
        working-directory: ./mobile
        run: |
          DOWNLOAD_JSON=$(eas build:download --build-id "${{ steps.build.outputs.build_id }}" --json)
          echo "$DOWNLOAD_JSON"
          APK_PATH=$(echo "$DOWNLOAD_JSON" | jq -r '.path // empty')
          test -n "$APK_PATH"
          test -f "$APK_PATH"
          mv "$APK_PATH" "$GITHUB_WORKSPACE/app-release.apk"
          test -s "$GITHUB_WORKSPACE/app-release.apk"

      - name: 创建 Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: app-release.apk
          body: |
            ## 变更内容

            ${{ github.event.head_commit.message }}
          generate_release_notes: true
